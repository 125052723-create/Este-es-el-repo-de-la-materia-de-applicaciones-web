<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />

    <title>Login</title>
</head>

<body>
    {% extends 'nav_footer.html' %}

    {% block content %}

    <div style="margin-left: 400px; margin-bottom: 100px; margin-top: 50px;">
        <h1 class="text-3xl font-bold">
            INICIAR SESION
        </h1>
        <br>
        <form action="{{ url_for('login') }}" method="post">
            <label class="text-xl">Correo:</label>
            <br>
            <br>


            <label class="input validator">
                <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none"
                        stroke="currentColor">
                        <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                    </g>
                </svg>
                <input type="email" placeholder="mail@site.com" name="correo" required />
            </label>
            <div class="validator-hint hidden">Ingrese una direccion de correo valida</div>


            <br>
            <br>
            <br>
            <label class="text-xl">Contraseña:</label>
            <br>
            <br>
            <label class="input validator">
                <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none"
                        stroke="currentColor">
                        <path
                            d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z">
                        </path>
                        <circle cx="16.5" cy="7.5" r=".5" fill="currentColor"></circle>
                    </g>
                </svg>
                <input type="password" required placeholder="Contraseña" name="password"
                    
                    />
            </label>
            <br>
            <br>
            <button type="submit" class="btn btn-neutral">Entrar</button>

        </form>
        <br>
        <p><a href="{{ url_for('registro') }}" class="link link-hover">No tienes cuenta?</a></p>

    </div>
    {% endblock %}

</body>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</html>
